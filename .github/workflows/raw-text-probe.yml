name: Raw text artifact response probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save @azure/storage-blob@12.27.0
      - uses: ./.github/actions/raw-text-probe
